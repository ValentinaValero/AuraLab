<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<title>AuraLab Login</title>
<link rel="stylesheet" href="../CSS/login.css">

</head>

<body>

<div class="card">

    <div class="logo">AuraLab</div>

    <input class="input" id="email" type="email" placeholder="Email">
    <div class="erro" id="erroEmail">Digite um email válido</div>

    <div class="senha-box">
        <input class="input" id="senha" type="password" placeholder="Senha">
        <span class="verSenha" id="toggleSenha"><i class="fa-solid fa-eye"></i></span>
    </div>

    

    <button class="btn">Entrar</button>

    <div class="small">
        Ainda não tem uma conta?<br>
        <a href="cadastro.html">Cadastre-se</a>
    </div>

</div>

<script src="../JS/login.js"></script>
</body>
</html>
