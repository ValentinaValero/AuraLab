<!DOCTYPE html>
<html lang="port-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geom:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <title>pagina inicial</title>
    <link rel="stylesheet" href="../CSS/paginainicial.css">
</head>

<body>

    <div class="container">

        <header class="navBar">
            <a href="../HTML/paginainicial.html">
                <h1>AuraLab</h1>
            </a>
        </header>

        <div class="bem-vindo">
            Bem-vindo
        </div>

        <div class="salas">

            <h2>Salas</h2>

            <div class="cards">

                <div class="card" id="openModal">
                    <div class="mais">+</div>
                </div>

                <a href="../HTML/nomes.html">
                    <div class="card">
                        Sala:<br>3°DS
                    </div>
                </a>

                <a>
                    <div class="card">
                        Sala:<br>9°B
                    </div>
                </a>

            </div>

        </div>

    </div>

    <div id="modalOverlay" class="overlay">
        <div class="modal-content">
            <h3>Adicionar Sala</h3>

            <input type="text" id="serie" placeholder="Série">
            <div class="erro-texto" id="erroSerie"></div>

            <input type="text" id="turma" placeholder="Turma">
            <div class="erro-texto" id="erroTurma"></div>

            <button class="btn-confirmar" id="closeModal">Confirmar</button>
        </div>
    </div>
    <script src="../JS/paginainicial.script.js"></script>
</body>

</html>
